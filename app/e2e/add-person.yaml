appId: com.tahardi.littlethings
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible:
      id: 'add-person'
    timeout: 60000
- tapOn:
    id: 'add-person'
- tapOn:
    id: 'answer-input'
- inputText: 'Priya Nair'
- hideKeyboard
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: 'next-button'
      - assertVisible: '2 of 8'
- tapOn:
    id: 'answer-input'
- inputText: 'Pri'
- hideKeyboard
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: 'next-button'
      - assertVisible: '3 of 8'
- tapOn:
    id: 'skip-button'
- assertVisible: '4 of 8'
- tapOn:
    id: 'skip-button'
- assertVisible: '5 of 8'
- tapOn:
    id: 'skip-button'
- assertVisible: '6 of 8'
- tapOn:
    id: 'skip-button'
- assertVisible: '7 of 8'
- tapOn:
    id: 'skip-button'
- assertVisible: '8 of 8'
- tapOn:
    id: 'answer-input'
- inputText: 'chess, gardening'
- hideKeyboard
- tapOn:
    id: 'save-button'
